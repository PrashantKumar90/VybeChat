server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker must be served from the root scope with no
    # aggressive caching, or updates to sw.js won't be picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
